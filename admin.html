<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel &mdash; Young Professionals Forum</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#102016;--muted:#607064;--green:#176b38;--green2:#0e4d28;--cream:#f6f4ec;--paper:#fff;--line:#dfe6df;--radius:24px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--cream);font-family:"DM Sans",system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.container{width:min(1100px,94%);margin:auto}
.nav{position:sticky;top:0;z-index:20;background:rgba(246,244,236,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(16,32,22,.08)}
.navin{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700}
.brand img{width:40px;height:40px;object-fit:contain}
.btn{border:1px solid var(--green);padding:11px 17px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;background:transparent}
.btn:hover{background:#eef3ea}
.save-btn{padding:6px 14px;font-size:12px}
main{padding:44px 0 90px}
.loading,.denied{color:var(--muted);padding:60px 0;text-align:center}
h1{font-family:Fraunces,serif;font-weight:600;font-size:32px;margin:0 0 6px}
.table-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:14px 14px;border-bottom:2px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
select{padding:8px 10px;border:1px solid #d7dfd7;border-radius:10px;font:inherit;background:#fbfdf9;width:100%}
.row-msg{font-size:12px;color:var(--green);margin-top:4px;display:none;font-weight:600}
.row-msg.show{display:block}
</style>
</head>
<body>

<nav class="nav"><div class="container navin">
  <a class="brand" href="index.html">
    <img src="logo.png" alt="Young Professionals Forum logo">
    <span>Young Professionals Forum &mdash; Admin</span>
  </a>
  <a class="btn" href="member.html">Back to Member Area</a>
</div></nav>

<main><div class="container">
  <div id="loadingState" class="loading">Checking access…</div>
  <div id="deniedState" class="denied" style="display:none;">
    You don't have access to this page. <a href="member.html">Go back</a>.
  </div>

  <div id="adminTable" style="display:none;">
    <h1>Members</h1>
    <p style="color:var(--muted); margin:0 0 24px;">Assign districts and peer groups, and approve new members.</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Email</th><th>Phone</th><th>District cluster</th><th>Peer group</th><th>Approved</th><th></th>
          </tr>
        </thead>
        <tbody id="membersBody"></tbody>
      </table>
    </div>
  </div>
</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  var DISTRICTS = ['Not sure yet', 'Ajasa District Cluster', 'Olakitan District Cluster', 'Courage District Cluster', 'Ikola District Cluster'];
  var GROUPS = ['Not sure yet', 'Built Environment', 'Business & Finance', 'Tech & Digital', 'Health & Education', 'Creative & Media', 'Students & Early Career'];

  function optionsHtml(list, selected){
    return list.map(function(opt){
      return '<option' + (opt === selected ? ' selected' : '') + '>' + opt + '</option>';
    }).join('');
  }

  async function init(){
    var { data } = await sb.auth.getSession();
    if (!data.session){
      window.location.href = 'index.html';
      return;
    }

    var { data: me, error: meErr } = await sb.from('profiles').select('is_admin').eq('id', data.session.user.id).single();
    if (meErr || !me || !me.is_admin){
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('deniedState').style.display = 'block';
      return;
    }

    var { data: members, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
    if (error){
      document.getElementById('loadingState').textContent = 'Error loading members: ' + error.message;
      return;
    }

    var body = document.getElementById('membersBody');
    body.innerHTML = members.map(function(m){
      return '<tr data-id="' + m.id + '">' +
        '<td>' + (m.full_name || '&mdash;') + '</td>' +
        '<td>' + (m.email || '&mdash;') + '</td>' +
        '<td>' + (m.phone || '&mdash;') + '</td>' +
        '<td><select class="f-district">' + optionsHtml(DISTRICTS, m.district_cluster) + '</select></td>' +
        '<td><select class="f-group">' + optionsHtml(GROUPS, m.group_interest) + '</select></td>' +
        '<td><input type="checkbox" class="f-approved" ' + (m.approved ? 'checked' : '') + '></td>' +
        '<td>' +
          '<button class="btn save-btn" onclick="saveRow(this)">Save</button>' +
          '<div class="row-msg">Saved.</div>' +
        '</td>' +
      '</tr>';
    }).join('');

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('adminTable').style.display = 'block';
  }

  async function saveRow(btn){
    var row = btn.closest('tr');
    var id = row.getAttribute('data-id');
    var district = row.querySelector('.f-district').value;
    var group = row.querySelector('.f-group').value;
    var approved = row.querySelector('.f-approved').checked;

    var { error } = await sb.from('profiles').update({
      district_cluster: district, group_interest: group, approved: approved
    }).eq('id', id);

    var msg = row.querySelector('.row-msg');
    msg.textContent = error ? ('Error: ' + error.message) : 'Saved.';
    msg.classList.add('show');
    setTimeout(function(){ msg.classList.remove('show'); }, 2500);
  }

  init();
</script>

</body>
</html>
