<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel &mdash; Young Professionals Forum</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14241C; --green-deep:#1F6B33; --green-bright:#7CC142;
    --green-pale:#EAF5E1; --green-line:#D3E6C6; --white:#FFFFFF; --max:1100px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Work Sans', sans-serif; color:var(--ink); background:var(--white); line-height:1.5;}
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; margin:0;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 28px;}
  header{border-bottom:1px solid var(--green-line); padding:16px 0;}
  .nav{display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink);}
  .brand img{height:34px; width:34px; object-fit:contain;}
  .brand span{font-family:'Fraunces', serif; font-weight:600;}
  .btn{
    font-family:'Work Sans', sans-serif; font-weight:600; font-size:0.9rem;
    padding:9px 18px; border-radius:3px; border:1.5px solid var(--green-deep);
    cursor:pointer; text-decoration:none; display:inline-block; background:transparent; color:var(--green-deep);
  }
  .btn:hover{background:var(--green-pale);}
  .btn-solid{background:var(--green-deep); color:#fff; border-color:var(--green-deep);}
  .btn-solid:hover{background:#195828;}
  main{padding:40px 0 80px;}
  .loading, .denied{color:#5A6B57; padding:60px 0; text-align:center;}
  table{width:100%; border-collapse:collapse; font-size:0.9rem;}
  th{
    text-align:left; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.02em;
    color:#5A6B57; padding:10px 12px; border-bottom:2px solid var(--green-line);
  }
  td{padding:10px 12px; border-bottom:1px solid var(--green-line); vertical-align:middle;}
  select, input[type=text]{
    padding:6px 8px; border:1.5px solid var(--green-line); border-radius:3px;
    font-family:'Work Sans', sans-serif; font-size:0.85rem; background:#FBFDF9; width:100%;
  }
  .save-btn{padding:6px 12px; font-size:0.8rem;}
  .row-msg{font-size:0.78rem; color:var(--green-deep); margin-top:4px; display:none;}
  .row-msg.show{display:block;}
  .table-wrap{overflow-x:auto;}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="index.html">
      <img src="logo.png" alt="Young Professionals Forum logo">
      <span>Young Professionals Forum &mdash; Admin</span>
    </a>
    <a class="btn" href="member.html">Back to Member Area</a>
  </div>
</header>

<main class="wrap">
  <div id="loadingState" class="loading">Checking access…</div>
  <div id="deniedState" class="denied" style="display:none;">
    You don't have access to this page. <a href="member.html">Go back</a>.
  </div>

  <div id="adminTable" style="display:none;">
    <h1 style="margin-bottom:6px;">Members</h1>
    <p style="color:#5A6B57; margin-top:0 0 24px;">Assign districts and groups, and approve new members.</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Email</th><th>Phone</th><th>District cluster</th><th>Group</th><th>Approved</th><th></th>
          </tr>
        </thead>
        <tbody id="membersBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  var DISTRICTS = ['Not sure yet', 'Ajasa District Cluster', 'Olakitan District Cluster', 'Courage District Cluster', 'Ikola District Cluster'];
  var GROUPS = ['Not sure yet', 'Built Environment', 'Business & Finance', 'Tech & Digital', 'Health & Education', 'Creative & Media', 'Students & Early Career'];

  function optionsHtml(list, selected){
    return list.map(function(opt){
      return '<option' + (opt === selected ? ' selected' : '') + '>' + opt + '</option>';
    }).join('');
  }

  async function init(){
    var { data } = await sb.auth.getSession();
    if (!data.session){
      window.location.href = 'index.html';
      return;
    }

    var { data: me, error: meErr } = await sb.from('profiles').select('is_admin').eq('id', data.session.user.id).single();
    if (meErr || !me || !me.is_admin){
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('deniedState').style.display = 'block';
      return;
    }

    var { data: members, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
    if (error){
      document.getElementById('loadingState').textContent = 'Error loading members: ' + error.message;
      return;
    }

    var body = document.getElementById('membersBody');
    body.innerHTML = members.map(function(m){
      return '<tr data-id="' + m.id + '">' +
        '<td>' + (m.full_name || '&mdash;') + '</td>' +
        '<td>' + (m.email || '&mdash;') + '</td>' +
        '<td>' + (m.phone || '&mdash;') + '</td>' +
        '<td><select class="f-district">' + optionsHtml(DISTRICTS, m.district_cluster) + '</select></td>' +
        '<td><select class="f-group">' + optionsHtml(GROUPS, m.group_interest) + '</select></td>' +
        '<td><input type="checkbox" class="f-approved" ' + (m.approved ? 'checked' : '') + '></td>' +
        '<td>' +
          '<button class="btn save-btn" onclick="saveRow(this)">Save</button>' +
          '<div class="row-msg">Saved.</div>' +
        '</td>' +
      '</tr>';
    }).join('');

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('adminTable').style.display = 'block';
  }

  async function saveRow(btn){
    var row = btn.closest('tr');
    var id = row.getAttribute('data-id');
    var district = row.querySelector('.f-district').value;
    var group = row.querySelector('.f-group').value;
    var approved = row.querySelector('.f-approved').checked;

    var { error } = await sb.from('profiles').update({
      district_cluster: district, group_interest: group, approved: approved
    }).eq('id', id);

    var msg = row.querySelector('.row-msg');
    msg.textContent = error ? ('Error: ' + error.message) : 'Saved.';
    msg.classList.add('show');
    setTimeout(function(){ msg.classList.remove('show'); }, 2500);
  }

  init();
</script>

</body>
</html>
