<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Area &mdash; Young Professionals Forum</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#102016;--muted:#607064;--green:#176b38;--green2:#0e4d28;--cream:#f6f4ec;--paper:#fff;--line:#dfe6df;--radius:24px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--cream);font-family:"DM Sans",system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.container{width:min(760px,92%);margin:auto}
.nav{position:sticky;top:0;z-index:20;background:rgba(246,244,236,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(16,32,22,.08)}
.navin{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700}
.brand img{width:40px;height:40px;object-fit:contain}
.btn{border:1px solid var(--green);padding:11px 17px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;background:transparent}
.btn-solid{background:var(--green);color:#fff;border-color:var(--green)}
.btn-solid:hover{background:var(--green2)}
main{padding:56px 0 90px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:34px;box-shadow:0 6px 25px rgba(16,32,22,.035)}
.card h2{font-family:Fraunces,serif;font-weight:600;font-size:28px;margin:0 0 6px}
.card p.sub{color:var(--muted);margin:0 0 24px;font-size:15px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;border:1px solid #d7dfd7;border-radius:12px;font:inherit;background:#fbfdf9}
.field input[disabled]{color:#8a968a;background:#f3f6f1}
.status-badge{display:inline-block;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px}
.status-approved{background:#e7f3ea;color:var(--green)}
.status-pending{background:#fdf3e3;color:#8a6516}
.loading{color:var(--muted);padding:60px 0;text-align:center}
.save-msg{display:none;color:var(--green);font-size:14px;margin-top:12px;font-weight:600}
.save-msg.show{display:block}
</style>
</head>
<body>

<nav class="nav"><div class="container navin">
  <a class="brand" href="index.html">
    <img src="logo.png" alt="Young Professionals Forum logo">
    <span>Young Professionals Forum</span>
  </a>
  <button class="btn" onclick="logout()">Log out</button>
</div></nav>

<main><div class="container">
  <div id="loadingState" class="loading">Loading your profile…</div>

  <div id="profileCard" style="display:none;">
    <div class="card">
      <h2 id="welcomeName">Welcome</h2>
      <p class="sub">Your membership status: <span id="statusBadge" class="status-badge"></span></p>

      <div id="adminLinkWrap" style="display:none; margin-bottom:22px;">
        <a class="btn btn-solid" href="admin.html">Go to Admin Panel</a>
      </div>

      <form onsubmit="return saveProfile(event)">
        <div class="field">
          <label>Email</label>
          <input id="p-email" type="email" disabled>
        </div>
        <div class="field">
          <label for="p-phone">Phone number</label>
          <input id="p-phone" type="tel">
        </div>
        <div class="field">
          <label for="p-district">District cluster</label>
          <select id="p-district">
            <option>Not sure yet</option>
            <option>Ajasa District Cluster</option>
            <option>Olakitan District Cluster</option>
            <option>Courage District Cluster</option>
            <option>Ikola District Cluster</option>
          </select>
        </div>
        <div class="field">
          <label for="p-group">Peer group</label>
          <select id="p-group">
            <option>Not sure yet</option>
            <option>Built Environment</option>
            <option>Business &amp; Finance</option>
            <option>Tech &amp; Digital</option>
            <option>Health &amp; Education</option>
            <option>Creative &amp; Media</option>
            <option>Students &amp; Early Career</option>
          </select>
        </div>
        <button class="btn btn-solid" type="submit">Save changes</button>
        <div class="save-msg" id="saveMsg">Saved.</div>
      </form>
    </div>
  </div>
</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  var currentUserId = null;

  async function init(){
    var { data } = await sb.auth.getSession();
    if (!data.session){
      window.location.href = 'index.html';
      return;
    }
    currentUserId = data.session.user.id;

    var { data: profile, error } = await sb.from('profiles').select('*').eq('id', currentUserId).single();
    if (error){
      document.getElementById('loadingState').textContent = 'Could not load your profile: ' + error.message;
      return;
    }

    document.getElementById('welcomeName').textContent = 'Welcome, ' + (profile.full_name || 'friend');
    document.getElementById('p-email').value = profile.email || '';
    document.getElementById('p-phone').value = profile.phone || '';
    document.getElementById('p-district').value = profile.district_cluster || 'Not sure yet';
    document.getElementById('p-group').value = profile.group_interest || 'Not sure yet';

    var badge = document.getElementById('statusBadge');
    if (profile.approved){
      badge.textContent = 'Approved member';
      badge.classList.add('status-approved');
    } else {
      badge.textContent = 'Pending approval';
      badge.classList.add('status-pending');
    }

    if (profile.is_admin){
      document.getElementById('adminLinkWrap').style.display = 'block';
    }

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('profileCard').style.display = 'block';
  }

  async function saveProfile(e){
    e.preventDefault();
    var phone = document.getElementById('p-phone').value.trim();
    var district = document.getElementById('p-district').value;
    var group = document.getElementById('p-group').value;

    var { error } = await sb.from('profiles').update({
      phone: phone, district_cluster: district, group_interest: group
    }).eq('id', currentUserId);

    var msg = document.getElementById('saveMsg');
    msg.textContent = error ? ('Error: ' + error.message) : 'Saved.';
    msg.classList.add('show');
    setTimeout(function(){ msg.classList.remove('show'); }, 3000);
    return false;
  }

  async function logout(){
    await sb.auth.signOut();
    window.location.href = 'index.html';
  }

  init();
</script>

</body>
</html>
